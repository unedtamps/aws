- name: Baseline setup for control
  hosts: control
  become: true
  tasks:
    - name: Include common baseline
      ansible.builtin.include_role:
        name: common
    - name: Include reverse proxy
      ansible.builtin.include_role:
        name: reverse_proxy
    - name: Show Host Info
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} role={{ app_role }}"
