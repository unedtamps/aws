- name: Baseline setup for workers
  hosts: workers
  become: true
  tasks:
    - name: Include common baseline
      ansible.builtin.include_role:
        name: common
    - name: Include docker
      ansible.builtin.include_role:
        name: docker
    - name: Include ansible-app
      ansible.builtin.include_role:
        name: ansible_app
    - name: Show Host Info
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} role={{ app_role }}"
