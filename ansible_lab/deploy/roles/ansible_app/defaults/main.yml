# defaults file for ansible_app
#
# Go API container (unedotamps/ansible-app). Port 8000 is inside the
# 8000-8020 range that ansible-sg allows in from http-sg; the
# reverse_proxy role builds its upstream from reverse_proxy_app_port.
ansible_app_image: unedotamps/ansible-app:latest
ansible_app_name: ansible-app
ansible_app_port: "8000"
ansible_app_restart_policy: unless-stopped
# db_string is the plain alias defined in group_vars/workers/workers.yml;
# the actual secret lives in inventory/group_vars/workers/vault.yml as
# vault_db_string. Deliberately no fallback — the play fails loudly if the
# secret is missing. The container env var is DB_STRING (uppercase).
ansible_app_db_string: "{{ db_string }}"
