# tasks file for reverse_proxy
#
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
- name: Install NGINX
  ansible.builtin.apt:
    name: nginx
    state: present
- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
- name: Deploy reverse proxy site config
  ansible.builtin.template:
    src: config.j2
    dest: /etc/nginx/sites-available/ansiible-lab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx
- name: Enable reverse proxy site config
  ansible.builtin.file:
    src: /etc/nginx/sites-available/ansiible-lab.conf
    dest: /etc/nginx/sites-enabled/ansiible-lab.conf
    state: link
  notify: Reload nginx
- name: Ensure NGINX is running and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
