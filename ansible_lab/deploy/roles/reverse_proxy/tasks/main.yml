# tasks file for nginx
#
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
- name: Install NGINX
  ansible.builtin.apt:
    name: nginx
    state: present
- name: Ensure NGINX is running and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
