{{- range .Values.platform.namespaces }}
{{- if not (lookup "v1" "Namespace" "" .) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
  labels:
    {{- include "platform.labels" $ | nindent 4 }}
{{- end }}
{{- end }}
