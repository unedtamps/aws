platform:
  namespaces:
    - traefik
    - argocd
    - external-secrets
aws-ebs-csi-driver:
  controller:
    k8sTagClusterId: lab-eks
    serviceAccount:
      name: ebs-csi-controller-sa
  node:
    serviceAccount:
      name: ebs-csi-node-sa
    enableWindows: false
  storageClasses:
    - name: gp3
      parameters:
        type: gp3
        encrypted: "true"
        fsType: ext4
      reclaimPolicy: Retain
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
aws-load-balancer-controller:
  clusterName: lab-eks
  region: ap-southeast-1
  # Replace with `tofu output vpc_id` after re-provisioning in ap-southeast-1.
  vpcId: vpc-04b8aac84a36b4d0e
  fullnameOverride: aws-load-balancer-controller
external-secrets:
  namespaceOverride: external-secrets
  fullnameOverride: external-secrets
  installCRDs: true
  serviceAccount:
    create: true
    name: external-secrets
argo-cd:
  namespaceOverride: argocd
  fullnameOverride: argocd
traefik:
  namespaceOverride: traefik
  fullnameOverride: traefik
  deployment:
    replicas: 5
    healthchecksPort: 8082
  ports:
    # `port` is Traefik's container listener; `exposedPort` becomes the
    # `traefik` Service port (the NLB target). This does not affect app
    # Services in goapi-dev, which Traefik reaches through IngressRoutes.
    api:
      port: 8000
      exposedPort: 80
      expose:
        default: true
      protocol: TCP
    # Only `api` is enabled: NLB :443 -> traefik Service :80 -> pod :8000.
    health:
      port: 8082
      expose:
        default: false
    web: null
    websecure: null
    metrics: null
    traefik: null
  metrics:
    prometheus: null
  additionalArguments:
    - "--ping.entrypoint=health"
  api:
    dashboard: false
  providers:
    kubernetesCRD:
      enabled: true
      # IngressRoutes outside these namespaces are ignored (404).
      namespaces:
        - goapi-dev
        - prod
    kubernetesIngress:
      enabled: false
  service:
    spec:
      # ClusterIP only; the NLB and its TargetGroupBinding live in provision/.
      type: ClusterIP
  livenessProbe:
    periodSeconds: 30
  readinessProbe:
    failureThreshold: 3
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
