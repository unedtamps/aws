{{- /* Keep the generated Grafana admin password stable across upgrades. */ -}}
{{- $secret := lookup "v1" "Secret" .Release.Namespace "grafana-admin" -}}
{{- $password := randAlphaNum 24 -}}
{{- if $secret -}}
{{- $password = index $secret.data "admin-password" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  admin-user: {{ "admin" | b64enc | quote }}
  admin-password: {{ $password | b64enc | quote }}
