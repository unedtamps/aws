apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendence-service
  labels:
    app.kubernetes.io/name: attendence-service
spec:
  # Uploads live on a ReadWriteOnce volume, so keep exactly one replica.
  # Switch to MinIO/S3 before scaling this out.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: attendence-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attendence-service
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: attendence-service
          image: unedotamps/ontime-attendence:latest
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: DB_ATTENDENCE_HOST
              value: db-attendence
            - name: DB_ATTENDENCE_HOST_PORT
              value: "1521"
            - name: DB_ATTENDENCE_SERVICE
              value: FREEPDB1
            - name: DB_ATTENDENCE_USER
              valueFrom:
                secretKeyRef:
                  name: attendence-db-credentials
                  key: app-user
            - name: DB_ATTENDENCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: attendence-db-credentials
                  key: app-password
            - name: KAFKA_BROKERS
              value: ontime-kafka-bootstrap.ontime-dev.svc.cluster.local:9092
            - name: ATTENDENCE_UPLOAD_DIR
              value: /app/uploads
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: attendence-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: attendence-service
  labels:
    app.kubernetes.io/name: attendence-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: attendence-service
  ports:
    - name: http
      port: 80
      targetPort: http
