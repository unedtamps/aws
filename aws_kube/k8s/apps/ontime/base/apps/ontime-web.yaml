apiVersion: apps/v1
kind: Deployment
metadata:
  name: ontime-web
  labels:
    app.kubernetes.io/name: ontime-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ontime-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ontime-web
    spec:
      containers:
        - name: ontime-web
          image: unedotamps/ontime-web:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GATEWAY_INTERNAL_URL
              value: http://api-gateway
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ontime-web
  labels:
    app.kubernetes.io/name: ontime-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ontime-web
  ports:
    - name: http
      port: 80
      targetPort: http
