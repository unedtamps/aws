apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-identity
  labels:
    app.kubernetes.io/name: db-identity
    app.kubernetes.io/component: oracle
spec:
  serviceName: db-identity
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db-identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-identity
        app.kubernetes.io/component: oracle
    spec:
      securityContext:
        fsGroup: 54321
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: oracle
      containers:
        - name: oracle
          image: gvenzl/oracle-free:23-slim
          ports:
            - name: oracle
              containerPort: 1521
          env:
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-db-credentials
                  key: oracle-password
            - name: APP_USER
              valueFrom:
                secretKeyRef:
                  name: identity-db-credentials
                  key: app-user
            - name: APP_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-db-credentials
                  key: app-password
          volumeMounts:
            - name: oradata
              mountPath: /opt/oracle/oradata
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            exec:
              command: ["healthcheck.sh"]
            failureThreshold: 180
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["healthcheck.sh"]
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["healthcheck.sh"]
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 3584Mi
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: oradata
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3
        resources:
          requests:
            storage: 20Gi
---
