apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: identity-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: oracle-password
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: identity_sys_password
    - secretKey: app-user
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: identity_app_user
    - secretKey: app-password
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: identity_app_password
    - secretKey: master-password
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: identity_master_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: attendence-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: attendence-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: oracle-password
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: attendence_sys_password
    - secretKey: app-user
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: attendence_app_user
    - secretKey: app-password
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: attendence_app_password
