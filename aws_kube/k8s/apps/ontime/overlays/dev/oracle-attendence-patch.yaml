apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-attendence
spec:
  template:
    spec:
      initContainers:
        - name: ipc-tools
          image: busybox:1.36
          command:
            - sh
            - -ec
            - cp /bin/busybox /tools/busybox && chmod 0755 /tools/busybox
          volumeMounts:
            - name: ipctools
              mountPath: /tools
      containers:
        - name: oracle
          command:
            - /bin/bash
            - -ec
            - |
              IPC=/opt/ipctools/busybox
              if [ -x "$IPC" ]; then
                OUID=$("$IPC" id -u)
                for id in $("$IPC" awk -v uid="$OUID" 'NR>1 && $8 == uid {print $2}' /proc/sysvipc/shm 2>/dev/null); do
                  "$IPC" ipcrm -m "$id" 2>/dev/null || true
                done
                for id in $("$IPC" awk -v uid="$OUID" 'NR>1 && $5 == uid {print $2}' /proc/sysvipc/sem 2>/dev/null); do
                  "$IPC" ipcrm -s "$id" 2>/dev/null || true
                done
                for id in $("$IPC" awk -v uid="$OUID" 'NR>1 && $8 == uid {print $2}' /proc/sysvipc/msg 2>/dev/null); do
                  "$IPC" ipcrm -q "$id" 2>/dev/null || true
                done
              fi
              rm -rf /dev/shm/* 2>/dev/null || true
              exec /opt/oracle/container-entrypoint.sh
          volumeMounts:
            - name: ipctools
              mountPath: /opt/ipctools
            - name: diag
              mountPath: /opt/oracle/diag
          livenessProbe:
            exec:
              command: ["healthcheck.sh"]
            initialDelaySeconds: 300
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 10
      volumes:
        - name: ipctools
          emptyDir: {}
        - name: diag
          emptyDir:
            sizeLimit: 1Gi
