apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-attendence
spec:
  template:
    spec:
      containers:
        - name: oracle
          command:
            - /bin/bash
            - -ec
            - |
              # Clear stale shared-memory files left by an unclean container exit.
              rm -rf /dev/shm/* 2>/dev/null || true
              exec /opt/oracle/container-entrypoint.sh
          volumeMounts:
            - name: diag
              mountPath: /opt/oracle/diag
          livenessProbe:
            exec:
              command: ["healthcheck.sh"]
            initialDelaySeconds: 300
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 10
      volumes:
        - name: diag
          emptyDir:
            sizeLimit: 1Gi
