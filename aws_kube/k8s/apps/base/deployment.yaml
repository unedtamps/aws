apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-app
    spec:
      containers:
        - name: api-app
          image: unedotamps/api-app:latest
          env:
            - name: APP_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
