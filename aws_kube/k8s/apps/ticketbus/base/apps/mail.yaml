apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-service
  labels:
    app.kubernetes.io/name: mail-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ticketbus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mail-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mail-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: ticketbus
    spec:
      containers:
        - name: mail-service
          image: ghcr.io/unedtamps/ticketbus/mail-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: mail-config
          startupProbe:
            httpGet:
              path: /api/mail/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/mail/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/mail/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mail-service
  labels:
    app.kubernetes.io/name: mail-service
    app.kubernetes.io/part-of: ticketbus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mail-service
  ports:
    - name: http
      port: 8084
      targetPort: http
