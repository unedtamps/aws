apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ticketbus-app
  labels:
    app.kubernetes.io/part-of: ticketbus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: ticketbus-app
    creationPolicy: Owner
  data:
    - secretKey: jwt_private_key
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: auth_jwt_private_key
    - secretKey: jwt_public_key
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: auth_jwt_public_key
    - secretKey: admin_seeds
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: auth_admin_seeds
    - secretKey: ticketing_internal_api_key
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: ticketing_internal_api_key
    - secretKey: payment_internal_api_key
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: payment_internal_api_key
    - secretKey: webhook_callback_token
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: payment_webhook_callback_token
    - secretKey: xendit_api_key
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: payment_xendit_api_key
    - secretKey: s3_access_key_id
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: ticketing_s3_access_key_id
    - secretKey: s3_secret_access_key
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: ticketing_s3_secret_access_key
