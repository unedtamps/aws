apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ticketbus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: ticketbus
    creationPolicy: Owner
  data:
    - secretKey: auth_db_host
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: auth_db_host
    - secretKey: auth_db_port
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: auth_db_port
    - secretKey: auth_db_name
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: auth_db_name
    - secretKey: auth_db_user
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: auth_db_user
    - secretKey: auth_db_password
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: auth_db_password
    - secretKey: auth_db_sslmode
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: auth_db_sslmode
    - secretKey: ticketing_db_host
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: ticketing_db_host
    - secretKey: ticketing_db_port
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: ticketing_db_port
    - secretKey: ticketing_db_name
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: ticketing_db_name
    - secretKey: ticketing_db_user
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: ticketing_db_user
    - secretKey: ticketing_db_password
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: ticketing_db_password
    - secretKey: ticketing_db_sslmode
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: ticketing_db_sslmode
    - secretKey: payment_db_host
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: payment_db_host
    - secretKey: payment_db_port
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: payment_db_port
    - secretKey: payment_db_name
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: payment_db_name
    - secretKey: payment_db_user
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: payment_db_user
    - secretKey: payment_db_password
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: payment_db_password
    - secretKey: payment_db_sslmode
      remoteRef:
        key: lab-eks/external-secrets/app-2
        property: payment_db_sslmode
