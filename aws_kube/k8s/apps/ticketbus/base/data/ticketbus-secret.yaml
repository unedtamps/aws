# Fill the password values before applying. The Postgres StatefulSets and
# the ticketbus services read these keys. The host values point at the
# Services created in postgres.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: ticketbus
type: Opaque
stringData:
  auth_db_host: auth-db
  auth_db_port: "5432"
  auth_db_name: auth
  auth_db_user: auth
  auth_db_password: ""
  auth_db_sslmode: disable

  ticketing_db_host: ticketing-db
  ticketing_db_port: "5432"
  ticketing_db_name: ticketing
  ticketing_db_user: ticketing
  ticketing_db_password: ""
  ticketing_db_sslmode: disable

  payment_db_host: payment-db
  payment_db_port: "5432"
  payment_db_name: payment
  payment_db_user: payment
  payment_db_password: ""
  payment_db_sslmode: disable
